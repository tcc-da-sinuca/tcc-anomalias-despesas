[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    # SQLite não tem tipo decimal nativo; nos testes em memória isso é esperado.
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:Warning
markers =
    postgres: testes que exigem PostgreSQL (definir TEST_DATABASE_URL)
