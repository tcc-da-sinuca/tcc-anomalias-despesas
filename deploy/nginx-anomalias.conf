# Site do sistema no Nginx da VPS. Troque "anomalias.seudominio.com.br" pelo seu domínio.
#
#   sudo cp deploy/nginx-anomalias.conf /etc/nginx/sites-available/anomalias
#   sudo ln -s /etc/nginx/sites-available/anomalias /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d anomalias.seudominio.com.br   # HTTPS + redirecionamento
#
# O Certbot acrescenta o bloco "listen 443 ssl" e o redirecionamento de HTTP para HTTPS.
# Sem HTTPS o login não funciona: em produção o cookie de sessão só trafega por HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name anomalias.seudominio.com.br;

    # Importação de despesas: o app aceita arquivos de até 16 MB.
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8000;  # PORTA_APP do .env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
