services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcc}
      POSTGRES_DB: ${POSTGRES_DB:-despesas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro da rede do Compose o host do banco é "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@db:5432/${POSTGRES_DB:-despesas}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@db:5432/despesas_teste
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Job de reprocessamento das despesas novas (APScheduler). Mesma imagem do app, mas
  # sem o entrypoint: as migrations ficam a cargo do container "app". Se o banco ainda
  # não estiver pronto, o job registra o erro e tenta de novo no próximo ciclo.
  agendador:
    build: .
    entrypoint: ["flask", "agendador"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@db:5432/${POSTGRES_DB:-despesas}
      REPROCESSAMENTO_INTERVALO_MIN: ${REPROCESSAMENTO_INTERVALO_MIN:-15}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: on-failure  # com REPROCESSAMENTO_INTERVALO_MIN=0 ele termina e fica parado

volumes:
  pgdata:
