# Roda todos os testes (SQLite e PostgreSQL) a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcc
          POSTGRES_PASSWORD: tcc
          POSTGRES_DB: despesas_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tcc:tcc@localhost:5432/despesas_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
