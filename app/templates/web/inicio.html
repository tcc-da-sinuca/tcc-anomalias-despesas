{% extends "base.html" %}
{% block conteudo %}
<h1 class="h4 mb-4">Visão geral</h1>
<div class="row g-3">
  <div class="col-sm-4">
    <div class="card"><div class="card-body">
      <div class="text-muted small">Despesas cadastradas</div>
      <div class="fs-3 fw-semibold">{{ totais.despesas }}</div>
    </div></div>
  </div>
  <div class="col-sm-4">
    <div class="card"><div class="card-body">
      <div class="text-muted small">Lotes importados</div>
      <div class="fs-3 fw-semibold">{{ totais.lotes }}</div>
    </div></div>
  </div>
  <div class="col-sm-4">
    <div class="card"><div class="card-body">
      <div class="text-muted small">Alertas gerados</div>
      <div class="fs-3 fw-semibold">{{ totais.alertas }}</div>
    </div></div>
  </div>
</div>
<div class="d-flex flex-wrap gap-2 mt-4">
  <a class="btn btn-primary" href="{{ url_for('web.importar') }}">Importar despesas</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('web.despesas') }}">Ver despesas</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('web.estatisticas') }}">Estatísticas de referência</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('web.analises') }}">Executar análise</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('web.alertas') }}">Ver alertas</a>
</div>
{% endblock %}
